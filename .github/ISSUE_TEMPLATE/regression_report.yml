name: Regression report
description: Report behavior that worked before but now fails.
title: "[regression] "
labels: ["regression", "needs-triage"]
body:
  - type: input
    id: command
    attributes:
      label: Exact command
      placeholder: ta tests run <testId> --env staging --wait --json
    validations:
      required: true
  - type: input
    id: last-known-good
    attributes:
      label: Last known good version/date
      placeholder: v0.8.2 / 2026-03-01
    validations:
      required: true
  - type: input
    id: current-version
    attributes:
      label: Current CLI version
      placeholder: testerarmy --version
    validations:
      required: true
  - type: input
    id: artifacts
    attributes:
      label: Failing run ID or saved JSON path
      description: Include the cloud run ID, or the saved CLI response if no run was created.
      placeholder: <runId> or result.json
    validations:
      required: true
  - type: textarea
    id: what-changed
    attributes:
      label: What changed
      description: Product/code/env changes near regression.
    validations:
      required: true
  - type: textarea
    id: expected-vs-actual
    attributes:
      label: Expected vs actual
    validations:
      required: true
